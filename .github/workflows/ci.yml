# Continuous integration for the PES web app.
#
# Runs on every pull request into main or dev, and on every push to them.
# Three checks run side by side; the last job, "CI passed", succeeds only
# when all three do. Make "CI passed" a required status check on main (and
# dev) so a pull request cannot be merged until it is green.
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

# A newer push to the same pull request or branch cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: pes_app

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # the version Vercel builds production with
          cache: npm
          cache-dependency-path: pes_app/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # the version Vercel builds production with
          cache: npm
          cache-dependency-path: pes_app/package-lock.json
      - run: npm ci
      - name: Run unit tests with coverage
        run: npx vitest run --coverage --reporter=default --reporter=github-actions
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`;
              console.log(["### Unit test coverage (src/lib)", "", "| Measure | Covered | Count |", "|---|---|---|",
                row("lines"), row("statements"), row("functions"), row("branches")].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: pes_app/coverage/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # the version Vercel builds production with
          cache: npm
          cache-dependency-path: pes_app/package-lock.json
      - run: npm ci
      - run: npm run build

  # The one check to require in branch protection: it stays the same however
  # many jobs are added above.
  ci-passed:
    name: CI passed
    if: always()
    needs: [typecheck, unit-tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A required check did not pass (results: $RESULTS)"
              exit 1
            fi
          done
          echo "Typecheck, unit tests and build all passed."
